  <rect width="1000" height="760" fill="#ffffff"/>
  <text x="60" y="52" font-size="24" font-weight="600" fill="#1a1a1a">WHERE THE PRESSURE IS</text>
  <text x="60" y="76" font-size="14" fill="#555">Axial room modes in an ordinary bedroom — why the hum is worse in bed than in the yard</text>
