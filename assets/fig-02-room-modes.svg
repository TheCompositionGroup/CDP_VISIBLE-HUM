  <text x="300" y="708" font-size="11" fill="#1a6b5a">zero</text>
  <text x="524" y="750" font-size="11" fill="#b23b2e">max</text>
  <text x="650" y="118" font-size="12" font-weight="600" fill="#1a1a1a" letter-spacing="1">SECTION — 2.5 m CEILING</text>
