  <polyline fill="none" stroke="#b23b2e" stroke-width="2.5" points="80,645 100,645 120,646 140,648 160,651 180,654 200,658 220,663 240,667 260,673 280,678 300,684 320,690 340,696 360,702 380,707 400,713 420,717 440,722 460,726 480,729 500,732 520,733 540,735 560,735"/>
