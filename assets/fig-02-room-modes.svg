  <rect x="668" y="358" width="164" height="20" fill="#ffffff" fill-opacity="0.8" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="750" y="398" font-size="11" text-anchor="middle" fill="#1a1a1a">sleeping height = 0.6 m</text>
  <text x="750" y="414" font-size="11" text-anchor="middle" fill="#b23b2e">near the floor maximum</text>
  <text x="858" y="140" font-size="11" fill="#b23b2e">ceiling: high</text>
  <text x="858" y="432" font-size="11" fill="#b23b2e">floor: high</text>
  <text x="650" y="486" font-size="12" font-weight="600" fill="#1a1a1a" letter-spacing="1">LOWEST MODE PER DIMENSION</text>
  <line x1="650" y1="496" x2="940" y2="496" stroke="#1a1a1a" stroke-width="1"/>
  <text x="650" y="518" font-size="13" fill="#333">4.0 m length</text>
  <text x="940" y="518" font-size="13" font-weight="600" text-anchor="end" fill="#1a1a1a">42.9 Hz</text>
  <text x="650" y="542" font-size="13" fill="#333">3.5 m width</text>
  <text x="940" y="542" font-size="13" font-weight="600" text-anchor="end" fill="#1a1a1a">49.0 Hz</text>
  <text x="650" y="566" font-size="13" fill="#333">2.5 m height</text>
  <text x="940" y="566" font-size="13" font-weight="600" text-anchor="end" fill="#1a1a1a">68.6 Hz</text>
  <line x1="650" y1="580" x2="940" y2="580" stroke="#ccc" stroke-width="1"/>
  <text x="650" y="600" font-size="11" fill="#666">f = c / 2L   where c = 343 m/s</text>
  <rect x="650" y="620" width="290" height="86" fill="none" stroke="#1a6b5a" stroke-width="1.5"/>
  <text x="664" y="642" font-size="11" font-weight="600" fill="#1a6b5a">APPLIES ONLY IF</text>
  <text x="664" y="662" font-size="11" fill="#333">your measured tone falls roughly</text>
  <text x="664" y="678" font-size="11" fill="#333">between 40 and 80 Hz. Outside that</text>
  <text x="664" y="694" font-size="11" fill="#333">band this diagram says nothing.</text>
