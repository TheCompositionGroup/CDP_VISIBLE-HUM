  <text x="174" y="188" font-size="10" text-anchor="middle" fill="#666">head</text>
  <rect x="330" y="230" width="180" height="240" fill="none" stroke="#1a6b5a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="420" y="345" font-size="11" text-anchor="middle" fill="#1a6b5a">try here</text>
  <text x="420" y="362" font-size="11" text-anchor="middle" fill="#1a6b5a">for a few nights</text>
